[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-agent-monorepo"
version = "0.1.0"
description = "Production-oriented monorepo scaffold for industry intelligence workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "psycopg[binary]>=3.1.19",
  "redis>=5.0.4",
  "beautifulsoup4>=4.12.3",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20.0",
  "openai>=1.35.0",
  "pypdf>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"packages/core/utils.py" = ["UP017"]
"packages/db/bootstrap.py" = ["UP017"]
"packages/db/models/enums.py" = ["UP042"]
"packages/agents/schemas.py" = ["UP042"]
"packages/registry/research_prompts.py" = ["E501"]
"packages/sources/enums.py" = ["UP042"]
"packages/sources/schemas.py" = ["UP017"]
"packages/sources/citation.py" = ["UP017"]
"packages/sources/performance.py" = ["UP017"]
"packages/agents/workflow.py" = ["UP017"]
"packages/content/schemas.py" = ["UP042"]
"packages/content/service.py" = ["UP017"]
"packages/memory/schemas.py" = ["UP042"]
"packages/memory/service.py" = ["UP017"]
"packages/memory/repository.py" = ["UP017"]
"packages/memory/feedback.py" = ["UP017"]
"packages/delivery/service.py" = ["UP017"]
"packages/ingestion/service.py" = ["UP017"]
"packages/ingestion/storage.py" = ["UP017"]
"packages/tasks/repository.py" = ["UP017"]
"packages/evals/repository.py" = ["UP017"]
"packages/ops/service.py" = ["UP017"]
"apps/api/routes/*.py" = ["B008", "UP017"]
"packages/db/alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
