"packages/capability_gateway/health.py" = ["UP017"]
"packages/capability_gateway/telemetry.py" = ["UP017"]
"packages/execution/execution_lease.py" = ["UP017"]
"packages/execution/coordinator.py" = ["UP017"]
"scripts/gateway_g1_6_acceptance.py" = ["E402", "E501", "UP017"]
