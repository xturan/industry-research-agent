"scripts/g3_execution_acceptance.py" = ["E402", "E501", "UP017"]
"scripts/gateway_fullstack_acceptance.py" = ["E402", "E501", "UP017"]
"scripts/gateway_network_load_acceptance.py" = ["E402"]
"scripts/gateway_execution_load_acceptance.py" = ["E402", "UP017"]
"scripts/gateway_provider_load_acceptance.py" = ["E402", "UP017"]
