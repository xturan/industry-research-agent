[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-agent-monorepo"
version = "0.1.0"
description = "Production-oriented monorepo scaffold for industry intelligence workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "psycopg[binary]>=3.1.19",
  "redis>=5.0.4",
  "beautifulsoup4>=4.12.3",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20.0",
  "openai>=1.35.0",
  "pypdf>=5.4.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]
train = [
  "torch>=2.10",
  "peft>=0.12.0",
  "trl>=0.15.0",
  "datasets>=2.18.0",
  "bitsandbytes>=0.43.0",
  "accelerate>=0.28.0",
  "transformers>=4.45.0",
  "crawl4ai>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"packages/core/utils.py" = ["UP017"]
"packages/db/bootstrap.py" = ["UP017"]
