<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <defs>
    <style>
      .title { font: 700 34px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 20px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 17px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .mgmt { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .exec { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .gate { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .state { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .memory { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
      .artifact { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1040" fill="#ffffff"/>
  <text x="60" y="62" class="title">PLAN 驱动的 Subagent 工作流与自进化闭环</text>
  <text x="60" y="96" class="subtitle">从用户触发，到项目总监规划、Group2 实施、Group3 验证、项目总结员评估，再回写 PLAN / STATUS / Memory / Agent 能力</text>

  <rect x="40" y="130" width="1420" height="150" rx="12" class="lane"/>
  <text x="70" y="166" class="box-title">入口与施工图纸</text>
  <rect x="70" y="190" width="240" height="62" rx="10" class="state"/>
  <text x="92" y="218" class="box-title">用户指令</text>
  <text x="92" y="244" class="box-text">“开始实施PLAN”</text>
  <rect x="410" y="190" width="280" height="62" rx="10" class="artifact"/>
  <text x="432" y="218" class="box-title">.agent/STATUS.md</text>
  <text x="432" y="244" class="box-text">当前 active PLAN / phase</text>
  <rect x="790" y="190" width="310" height="62" rx="10" class="artifact"/>
  <text x="812" y="218" class="box-title">active PLAN</text>
  <text x="812" y="244" class="box-text">目标、范围、阶段、gate</text>
  <rect x="1190" y="190" width="230" height="62" rx="10" class="artifact"/>
  <text x="1212" y="218" class="box-title">AGENTS.md</text>
  <text x="1212" y="244" class="box-text">项目规则与高风险契约</text>
  <path d="M310 221 L410 221" class="arrow"/>
  <path d="M690 221 L790 221" class="arrow"/>
  <path d="M1100 221 L1190 221" class="arrow"/>

  <rect x="40" y="320" width="1420" height="155" rx="12" class="lane"/>
  <text x="70" y="356" class="box-title">Group 1: 管理与规划</text>
  <rect x="70" y="380" width="395" height="70" rx="10" class="mgmt"/>
  <text x="92" y="408" class="box-title">invest_project_director</text>
  <text x="92" y="434" class="box-text">读取 STATUS / PLAN，写入真实场景验证计划</text>
  <rect x="555" y="380" width="350" height="70" rx="10" class="gate"/>
  <text x="577" y="408" class="box-title">Director Gate</text>
  <text x="577" y="434" class="box-text">冻结范围、分配 Group2/3、保护契约</text>
  <rect x="995" y="380" width="380" height="70" rx="10" class="artifact"/>
  <text x="1017" y="408" class="box-title">PLAN 更新</text>
  <text x="1017" y="434" class="box-text">Real-world validation plan + worker assignment</text>
  <path d="M1180 252 C1180 295 260 300 260 380" class="arrow"/>
  <path d="M465 415 L555 415" class="arrow"/>
  <path d="M905 415 L995 415" class="arrow"/>

  <rect x="40" y="515" width="1420" height="180" rx="12" class="lane"/>
  <text x="70" y="551" class="box-title">Group 2: 实施</text>
  <rect x="70" y="580" width="410" height="78" rx="10" class="exec"/>
  <text x="92" y="608" class="box-title">invest_agent_architecture_builder</text>
  <text x="92" y="634" class="box-text">agent / harness / tool / provider 边界与脚手架</text>
  <rect x="560" y="580" width="360" height="78" rx="10" class="exec"/>
  <text x="582" y="608" class="box-title">invest_feature_programmer</text>
  <text x="582" y="634" class="box-text">具体代码、source、工具、API、script、tests</text>
  <rect x="1010" y="580" width="360" height="78" rx="10" class="artifact"/>
  <text x="1032" y="608" class="box-title">实现产物</text>
  <text x="1032" y="634" class="box-text">diff、tests、scripts、artifacts、runtime logs</text>
  <path d="M1185 450 C1185 500 275 520 275 580" class="arrow"/>
  <path d="M1185 450 C1185 500 740 520 740 580" class="arrow"/>
  <path d="M480 619 L560 619" class="dash"/>
  <path d="M920 619 L1010 619" class="arrow"/>

  <rect x="40" y="735" width="1420" height="160" rx="12" class="lane"/>
  <text x="70" y="771" class="box-title">Group 3: Gate 与验证</text>
  <rect x="70" y="795" width="380" height="70" rx="10" class="gate"/>
  <text x="92" y="823" class="box-title">invest_code_quality_checker</text>
  <text x="92" y="849" class="box-text">ruff / py_compile / focused pytest / import safety</text>
  <rect x="545" y="795" width="390" height="70" rx="10" class="gate"/>
  <text x="567" y="823" class="box-title">invest_functional_validator</text>
  <text x="567" y="849" class="box-text">按 PLAN 的真实场景验证可用性与失败透明度</text>
  <rect x="1030" y="795" width="350" height="70" rx="10" class="artifact"/>
  <text x="1052" y="823" class="box-title">Validation Snapshot</text>
  <text x="1052" y="849" class="box-text">命令、结果、证据 artifact、blocker、风险</text>
  <path d="M1190 658 C1190 710 260 715 260 795" class="arrow"/>
  <path d="M450 830 L545 830" class="arrow"/>
  <path d="M935 830 L1030 830" class="arrow"/>

  <rect x="40" y="930" width="1420" height="86" rx="12" class="lane"/>
  <rect x="70" y="948" width="360" height="48" rx="10" class="mgmt"/>
  <text x="92" y="979" class="box-title">invest_project_summarizer</text>
  <rect x="505" y="948" width="345" height="48" rx="10" class="memory"/>
  <text x="527" y="979" class="box-title">Memory / ACTIVE / LEARNINGS / ERRORS</text>
  <rect x="925" y="948" width="430" height="48" rx="10" class="state"/>
  <text x="947" y="979" class="box-title">更新 PLAN / STATUS / Agent 能力，仅在必要时进化</text>
  <path d="M1205 865 C1205 920 250 905 250 948" class="arrow"/>
  <path d="M430 972 L505 972" class="arrow"/>
  <path d="M850 972 L925 972" class="arrow"/>

  <text x="70" y="1018" class="small">关键约束：不记录隐藏推理链；不静默修改 EvidenceBundle / citation / research response / task state 等高风险契约；PLAN 完成后才评估 worker 能力更新。</text>
</svg>
